    <!-- Signup Form -->
    <div class="signup-container position-relative">
        <h2 class="text-center">Register</h2>
        <form >
            <!-- 2 column grid layout with text inputs for the first and last names -->
            <div class="row mb-4">
              <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" required>
                    <label for="floatingInput">Full Name</label>
                  </div>
              </div>
              <div class="col">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="floatingInput" required>
                    <label for="floatingInput">Email address</label>
                  </div>
              </div>
            </div>
          
            <!-- Age and Phone Number input -->
             <div class="row mb-4">
                <div class="col">
                    <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="floatingInput" required>
                        <label for="floatingInput">Age</label>
                      </div>
                 </div>
                
                 <div class="col">
                    <div class="form-floating mb-3">
                        <input type="tel" class="form-control" id="floatingInput" required>
                        <label for="floatingInput">Phone Number</label>
                      </div>
                 </div>
             </div>
            
          
          
           <!-- Password -->
            <div class="row mb-4">
                <div class="col">
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingInput" required>
                        <label for="floatingInput">Password</label>
                      </div>
                 </div>
                
                 <div class="col">
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingInput" required>
                        <label for="floatingInput">Confirm Password</label>
                      </div>
                 </div>
             </div>
          
          
            <div class="row mb-4">
                  <!-- Address input -->
            <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput">
                    <label for="floatingInput">Address</label>
                  </div>
              </div>
               <!-- Membership Plan -->
                <div class="col">
                    <!-- <label for="membershipPlan">Membership Plan</label> -->
                    <select class="form-select form-floating p-3" id="membership">
                        <option value="" disabled selected>Choose a new plan</option>
                        <option value="basic">Basic Plan- Rs2000/month</option>
                        <option value="standard">Standard Plan - Rs3000/month</option>
                        <option value="premium">Premium Plan - Rs4000/month</option>
                    </select>
                 </div>
            </div>
       

            <!-- Checkbox -->
            <div class="form-check d-flex justify-content-center mb-4">
              <input
                class="form-check-input me-2"
                type="checkbox"
                value=""
                id="form6Example8"
                checked
              />
              <label class="form-check-label" for="form6Example8"> Create an account? </label>
            </div>
          
            <!-- Submit button -->
             <div class="d-flex justify-content-center">
            <button data-mdb-ripple-init type="button" class="btn btn-primary btn-block mb-4 ">Register</button>
            <button data-mdb-ripple-init type="button" class="btn btn-danger btn-block mb-4 ms-4">Delete</button>
        </div>
          </form>
    </div>
