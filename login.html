<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- BoxIcon -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f7f8fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* Flexbox layout to push footer to the bottom */
        }

        .navbar {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: #fff;
        }

        .container-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 75px;
            width: 100%;
        }

        .login-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .btn-custom {
            background: #6d5bba;
            color: #fff;
            border: none;
        }

        .btn-custom:hover {
            background: #5c4aa3;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #6d5bba;
        }

        .buttons .btn {
            margin-left: 10px;
        }

        .footer {
            background-color: #222;
            color: #bbb;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand" href="/index.html">Muscle Mania Fitness Club</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto d-flex align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="/trainers.html">Trainers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/membership.html">Membership</a></li>
                    <div class="buttons">
                        <button class="btn btn-primary">
                            <li class="nav-item active"><a class="text-decoration-none text-white" href="/login.html">Login</a>
                            </li>
                        </button>
                        <button class="btn btn-success">
                            <li class="nav-item"><a class="text-decoration-none text-white"
                                    href="/signup.html">Sign-Up</a></li>
                        </button>
                    </div>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Centered Login Container -->
    <div class="container-wrapper">
        <div class="login-container">
            <h2 class="text-center">Login</h2>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password"
                        required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-custom w-100">Login</button>
                <div class="d-flex align-items-center py-4">
                    <hr class="flex-grow-1">
                    <span class="px-3 text-14">Or If you're new please Sign-Up</span>
                    <hr class="flex-grow-1">
                </div>
               <a href="/signup.html" class="btn btn-success w-100"> SignUp</a>
                <div class="text-center mt-3 ">
                    <a href="#" class="text-decoration-none">Forgot Password?</a>
                    <a href="/"></a>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer text-center">
    
        <p>
            &copy; 2025 Muscle Mania Fitness Club. All Rights Reserved. &nbsp; Follow us on  
           
            <a class="text-decoration-none text-white fs-4 p-2" href="https://www.facebook.com/groups/688611127941581"><i
                class='bx bxl-facebook'></i></a>
        <a class="text-decoration-none text-white fs-4 p-2"

        <a class="text-decoration-none text-white fs-4 p-2" href="https://www.tiktok.com/@musclemaniafitnessclub"> <i
                class='bx bxl-tiktok'></i></a>

    </footer>

</body>
